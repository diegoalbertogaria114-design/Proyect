<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados - DIWIFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="../assets/logo.png" alt="DIWIFA Logo" class="brand-logo"> DIWIFA<span>.</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        <a href="ventas.html" class="nav-item">
          <i class="fa-solid fa-cart-shopping"></i> Punto de Venta
        </a>
        <a href="inventario.html" class="nav-item">
          <i class="fa-solid fa-boxes-stacked"></i> Inventario
        </a>
        <a href="clientes.html" class="nav-item">
          <i class="fa-solid fa-users"></i> Clientes
        </a>
        <a href="asistencia.html" class="nav-item">
          <i class="fa-solid fa-clock"></i> Asistencia
        </a>
        
        <div class="admin-only-container">
          <hr style="border: 0; border-top: 1px solid var(--surface-border); margin: 1rem 0;">
          <a href="empleados.html" class="nav-item active admin-only">
            <i class="fa-solid fa-user-tie"></i> Empleados
          </a>
                              <a href="reportes.html" class="nav-item admin-only">
            <i class="fa-solid fa-file-invoice"></i> Reportes
          </a>
          <a href="mensajes.html" class="nav-item admin-only">
            <i class="fa-solid fa-envelope"></i> Mensajes
          </a>
          <a href="configuracion.html" class="nav-item admin-only">
            <i class="fa-solid fa-gear"></i> Configuración
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="#" id="logoutBtn" class="btn btn-outline" style="width: 100%; border-color: var(--danger-color); color: var(--danger-color);">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir
        </a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2 style="margin: 0; font-size: 1.5rem;">Gestión de Empleados</h2>
        </div>
        
        <div class="user-menu">
          <div class="user-info text-right" style="text-align: right;">
            <span class="user-name" id="displayUserName">Usuario</span>
            <span class="badge badge-success user-role" id="displayUserRole">ROL</span>
          </div>
          <div class="user-avatar" id="displayUserAvatar">U</div>
        </div>
      </header>

      <div class="content-area">
        
        <div class="glass-card mb-4" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
          <div>
            <h3 style="margin: 0;">Empleados y Usuarios</h3>
            <p style="margin: 0; font-size: 0.9rem;">Administra el personal y sus accesos al sistema.</p>
          </div>
          <button id="btnNuevoEmpleado" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Nuevo Empleado
          </button>
        </div>

        <div class="glass-card">
          <div class="table-container">
            <table id="empleadosTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Usuario</th>
                  <th>Cargo / Rol</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <!-- Contenido generado por JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Empleado -->
  <div class="modal-overlay" id="empleadoModal">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3 style="margin: 0;" id="modalTitle">Nuevo Empleado</h3>
        <button class="close-modal" id="closeModalBtn">&times;</button>
      </div>
      
      <form id="empleadoForm">
        <input type="hidden" id="empleadoId">
        
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="username">Nombre de Usuario (Para Login)</label>
          <input type="text" id="username" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="rol">Rol en el sistema</label>
          <select id="rol" class="form-control" required style="background: rgba(15, 23, 42, 0.9);">
            <option value="USER">Empleado (Ventas)</option>
            <option value="ADMIN">Administrador (Acceso Total)</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline" id="cancelModalBtn" style="flex: 1;">Cancelar</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/empleados.js"></script>
</body>
</html>
