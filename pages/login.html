<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - DIWIFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Estilos específicos para login */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 2rem;
    }
    .login-logo a {
      color: white;
    }
    .login-logo span {
      color: var(--primary-color);
    }
    .error-msg {
      color: var(--danger-color);
      background: rgba(239, 68, 68, 0.1);
      padding: 0.75rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">
      <a href="../index.html"><img src="../assets/logo.png" alt="DIWIFA Logo" class="brand-logo"> DIWIFA<span>.</span></a>
    </div>

    <div class="glass-card">
      <h2 class="text-center mb-1">Bienvenido de nuevo</h2>
      <p class="text-center mb-4">Ingresa tus credenciales para acceder al sistema</p>

      <div id="errorMsg" class="error-msg">
        Usuario o contraseña incorrectos.
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" class="form-control" placeholder="Ej: admin" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary mt-4" style="width: 100%;">
          Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
    
    <div class="text-center" style="margin-top: 1.5rem;">
      <a href="../index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-secondary)'">
        <i class="fa-solid fa-arrow-left"></i> Regresar a la página principal
      </a>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Lógica del Login
    document.addEventListener('DOMContentLoaded', () => {
      // Si ya está logueado, redirigir al dashboard
      if (auth.isAuthenticated()) {
        window.location.href = 'dashboard.html';
      }

      const loginForm = document.getElementById('loginForm');
      const errorMsg = document.getElementById('errorMsg');

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const btn = loginForm.querySelector('button');

        // Estado de carga
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
        btn.disabled = true;

        setTimeout(() => {
          if (auth.login(user, pass)) {
            // Login exitoso
            window.location.href = 'dashboard.html';
          } else {
            // Login fallido
            errorMsg.style.display = 'block';
            btn.innerHTML = originalHtml;
            btn.disabled = false;
          }
        }, 800); // Pequeño delay para simular carga
      });
    });
  </script>
</body>
</html>
